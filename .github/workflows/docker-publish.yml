name: Docker Image CI/CD

on:
  push:
    branches:
      - master 

jobs:
  build:
    runs-on: ubuntu-latest 
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image for ${{ matrix.architecture }}
        run: |
          docker buildx create --use  # Убедимся, что используется правильный контекст
          docker buildx build --platform linux/${{ matrix.architecture }} -t ${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest .

      - name: Push the Docker image to Docker Hub
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t ${{ secrets.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest --push .